    <summary id="dbpedia-info-heading">What is DBpedia?</summary>
    <div class="ollama-info-content">
      <p>DBpedia extracts structured information from Wikipedia and publishes it as linked open data. Bruno uses DBpedia to retrieve thinker names, dates, classes, and categories.</p>
      <p><a href="https://www.dbpedia.org/" target="_blank" rel="noopener noreferrer">Learn more about DBpedia</a></p>
    </div>
