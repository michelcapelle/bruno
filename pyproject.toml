[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bruno"
version = "0.1.0"
description = "A browser-based API for managing concepts and thinkers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bertopic>=0.17,<1",
    "Flask>=3.1,<4",
    "matplotlib>=3.8,<4",
    "nltk>=3.9,<4",
    "pandas>=1.5,<3",
    "pymongo>=4.6,<5",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6",
]

[project.scripts]
bruno = "bruno.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bruno = ["templates/*.html", "static/*.js", "static/*.css"]
